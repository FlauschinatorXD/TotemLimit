name: TotemLimit
main: io.github.flauschinatorxd.totemlimit.TotemLimitPlugin
api-version: '26.1'
author: FlauschinatorXD

permissions:
  totemlimit.bypass:
    description: Players with this permission ignore the totem limit.
    default: false
  totemlimit.admin:
    description: Access to /totemlimit (reload, set, check).
    default: op
